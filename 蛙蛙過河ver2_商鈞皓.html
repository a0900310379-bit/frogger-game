<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>蛙蛙過河 (Frogger) - 物理音效升級版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin: 5px 0;
            text-shadow: 2px 2px #000;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 4px solid #fff;
            background-color: #000;
        }
        canvas {
            display: block;
            max-height: 80vh; 
            object-fit: contain;
        }
        .instructions {
            margin-top: 10px;
            text-align: center;
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }
        kbd {
            background: #444;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>蛙蛙過河</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="520" height="520"></canvas>
    </div>
    <div class="instructions">
        移動：<kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><br>
        目標：避開車輛，踩著浮木抵達最上方！(小心落水或被車撞！)
    </div>

<script>
/**
 * 蛙蛙過河 (Frogger) - 包含粒子物理與 Web Audio API 音效
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- 音效系統 (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function initAudio() {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'crash') {
        // 車禍音效：低頻爆炸聲
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'splash') {
        // 落水音效：頻率快速變化的噗通聲
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.1);
        osc.frequency.linearRampToValueAtTime(50, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'goal') {
        // 達陣音效
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    }
}

// 基礎設定參數
const gridSize = 40;
const cols = 13;
const width = canvas.width;
let height = canvas.height; 

// 遊戲狀態與分數
let level = 1;
let score = 0;
let highScore = localStorage.getItem('froggerHighScore') || 0;
let gameState = 'playing';
let speedMultiplier = 1;

// 動態行數設定
let waterRows = 5;
let roadRows = 5;
let rows = 13; 

// --- 物理粒子系統 ---
let particles = [];
class Particle {
    constructor(x, y, cause) {
        this.x = x;
        this.y = y;
        this.cause = cause;
        this.size = Math.random() * 5 + 2;
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.5) * 12;
        this.life = 1.0;
        
        // 根據死因設定粒子顏色
        if (cause === 'car') {
            const colors = ['#FF0000', '#8B0000', '#32CD32']; // 血與青蛙碎片
            this.color = colors[Math.floor(Math.random() * colors.length)];
        } else {
            const colors = ['#E0FFFF', '#87CEFA', '#1E90FF']; // 水花
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.vy -= 3; // 落水有向上濺起的初速度
        }
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        
        if (this.cause === 'water') {
            this.vy += 0.5; // 水花有重力效果
        } else {
            this.vx *= 0.95; // 車禍碎片摩擦力減速
            this.vy *= 0.95;
        }
        
        this.life -= 0.02;
    }

    draw() {
        if (this.life <= 0) return;
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

function spawnParticles(x, y, cause) {
    for (let i = 0; i < 40; i++) {
        particles.push(new Particle(x, y, cause));
    }
}

// 玩家(青蛙)物件
const frog = {
    x: 0,
    y: 0,
    size: gridSize,
    color: '#32CD32',
    isDead: false,
    reset: function() {
        this.x = Math.floor(cols / 2) * gridSize;
        this.y = height - gridSize;
        this.isDead = false;
    },
    draw: function() {
        if (this.isDead) return; // 死亡時隱藏本體，改畫粒子
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2 - 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(this.x + 8, this.y + 10, 4, 0, Math.PI * 2);
        ctx.arc(this.x + this.size - 8, this.y + 10, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x + 8, this.y + 9, 2, 0, Math.PI * 2);
        ctx.arc(this.x + this.size - 8, this.y + 9, 2, 0, Math.PI * 2);
        ctx.fill();
    }
};

// 障礙物與浮木類別
class Entity {
    constructor(x, y, w, h, speed, color, isLog) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.speed = speed;
        this.color = color;
        this.isLog = isLog; 
    }

    update() {
        this.x += this.speed * speedMultiplier;
        if (this.speed > 0 && this.x > width + 50) {
            this.x = -this.w - 50;
        } else if (this.speed < 0 && this.x < -this.w - 50) {
            this.x = width + 50;
        }
    }

    draw() {
        ctx.fillStyle = this.color;
        if (this.isLog) {
            ctx.fillRect(this.x, this.y + 4, this.w, this.h - 8);
            ctx.fillStyle = '#5C4033';
            ctx.fillRect(this.x + 5, this.y + 10, this.w - 10, 4);
        } else {
            ctx.fillRect(this.x, this.y + 6, this.w, this.h - 12);
            ctx.fillStyle = '#87CEEB';
            if (this.speed > 0) {
                ctx.fillRect(this.x + this.w - 15, this.y + 10, 10, this.h - 20);
            } else {
                ctx.fillRect(this.x + 5, this.y + 10, 10, this.h - 20);
            }
        }
    }
}

let entities = [];
function initLevel() {
    entities = [];
    particles = []; // 清空粒子
    
    waterRows = 4 + level; 
    roadRows = 4 + level;
    rows = 1 + waterRows + 1 + roadRows + 1; 
    
    canvas.height = rows * gridSize;
    height = canvas.height;
    
    speedMultiplier = 1 + (level - 1) * 0.1; 
    frog.reset();
    
    const carColors = ['#FF4500', '#FFD700', '#1E90FF', '#FF1493', '#FFFFFF'];
    const logColor = '#8B4513';
    
    const roadStartRow = waterRows + 2; 
    for (let i = 0; i < roadRows; i++) {
        let y = (roadStartRow + i) * gridSize;
        let dir = (i % 2 === 0) ? -1 : 1;
        let speed = dir * (1.2 + Math.random() * 2);
        let color = carColors[i % carColors.length];
        
        let numCars = 2 + Math.floor(Math.random() * 2);
        let spacing = width / numCars;
        
        for (let j = 0; j < numCars; j++) {
            let x = j * spacing + Math.random() * 40;
            let w = 40 + Math.floor(Math.random() * 2) * 40; 
            entities.push(new Entity(x, y, w, gridSize, speed, color, false));
        }
    }

    const waterStartRow = 1;
    for (let i = 0; i < waterRows; i++) {
        let y = (waterStartRow + i) * gridSize;
        let dir = (i % 2 === 0) ? 1 : -1;
        let speed = dir * (1.0 + Math.random() * 1.5);
        
        let numLogs = 2 + Math.floor(Math.random() * 2); 
        let spacing = width / numLogs;
        
        for (let j = 0; j < numLogs; j++) {
            let x = j * spacing + Math.random() * 40;
            let w = 80 + Math.floor(Math.random() * 3) * 40; 
            entities.push(new Entity(x, y, w, gridSize, speed, logColor, true));
        }
    }
}

function checkCollisions() {
    let frogHitbox = {
        left: frog.x + 8,
        right: frog.x + frog.size - 8,
        top: frog.y + 8,
        bottom: frog.y + frog.size - 8,
        centerX: frog.x + frog.size / 2
    };

    let onLog = false;
    let logSpeed = 0;

    for (let ent of entities) {
        let isOverlapping = !(
            frogHitbox.right < ent.x ||
            frogHitbox.left > ent.x + ent.w ||
            frogHitbox.bottom < ent.y ||
            frogHitbox.top > ent.y + ent.h
        );

        if (isOverlapping) {
            if (!ent.isLog) {
                gameOver('car');
                return;
            } else {
                if (frogHitbox.centerX >= ent.x && frogHitbox.centerX <= ent.x + ent.w) {
                    onLog = true;
                    logSpeed = ent.speed * speedMultiplier;
                }
            }
        }
    }

    let waterTop = gridSize;
    let waterBottom = waterRows * gridSize + (gridSize - 1);
    if (frog.y >= waterTop && frog.y <= waterBottom) {
        if (!onLog) {
            gameOver('water');
        } else {
            frog.x += logSpeed;
        }
    }

    if (frog.x < 0 || frog.x + frog.size > width) {
        gameOver('water');
    }
}

function reachGoal() {
    playSound('goal');
    score += 100 + (level * 20); 
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('froggerHighScore', highScore);
    }
    level++; 
    initLevel(); 
}

// 加入物理死亡機制
function gameOver(cause) {
    if (gameState === 'gameover') return;
    gameState = 'gameover';
    frog.isDead = true;
    
    let centerX = frog.x + frog.size / 2;
    let centerY = frog.y + frog.size / 2;
    
    if (cause === 'car') {
        playSound('crash');
        spawnParticles(centerX, centerY, 'car');
    } else {
        playSound('splash');
        spawnParticles(centerX, centerY, 'water');
    }
}

function drawBackground() {
    ctx.fillStyle = '#2E8B57';
    ctx.fillRect(0, 0, width, gridSize);

    ctx.fillStyle = '#104E8B';
    ctx.fillRect(0, gridSize, width, gridSize * waterRows);

    let safeRowY = (waterRows + 1) * gridSize;
    ctx.fillStyle = '#8FBC8F';
    ctx.fillRect(0, safeRowY, width, gridSize);

    let roadRowY = (waterRows + 2) * gridSize;
    ctx.fillStyle = '#444';
    ctx.fillRect(0, roadRowY, width, gridSize * roadRows);
    
    ctx.strokeStyle = '#999';
    ctx.setLineDash([15, 15]);
    ctx.beginPath();
    for (let i = waterRows + 3; i <= waterRows + 1 + roadRows; i++) {
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(width, i * gridSize);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    let startRowY = (waterRows + 2 + roadRows) * gridSize;
    ctx.fillStyle = '#8FBC8F';
    ctx.fillRect(0, startRowY, width, gridSize);
}

function drawUI() {
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 10, 28);
    
    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL: ${level}`, width / 2, 28);

    ctx.textAlign = 'right';
    ctx.fillText(`HIGH: ${highScore}`, width - 10, 28);

    if (gameState === 'gameover') {
        // 使用半透明黑色，讓底下的粒子特效還能微微看見
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#FF3333';
        ctx.font = 'bold 48px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', width / 2, height / 2 - 20);

        ctx.fillStyle = '#FFF';
        ctx.font = '20px Courier New';
        ctx.fillText('按 [空白鍵] 重新開始', width / 2, height / 2 + 30);
    }
}

// 主要遊戲迴圈
function gameLoop() {
    ctx.clearRect(0, 0, width, height);

    drawBackground();

    entities.forEach(ent => {
        if (gameState === 'playing') ent.update();
        ent.draw();
    });

    if (gameState === 'playing') {
        checkCollisions();
        if (frog.y === 0) reachGoal();
    }

    frog.draw();

    // 更新並繪製粒子效果 (即使在 Game Over 狀態也繼續運算噴濺動畫)
    particles.forEach(p => p.update());
    particles.forEach(p => p.draw());
    particles = particles.filter(p => p.life > 0);

    drawUI();

    requestAnimationFrame(gameLoop);
}

window.addEventListener('keydown', (e) => {
    initAudio(); // 確保瀏覽器允許播放音效

    if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
        e.preventDefault();
    }

    if (gameState === 'gameover') {
        if (e.code === 'Space') {
            level = 1;
            score = 0;
            initLevel();
            gameState = 'playing';
        }
        return;
    }

    if (gameState === 'playing') {
        const step = gridSize;
        let moved = false;
        switch (e.code) {
            case 'ArrowUp':
            case 'KeyW':
                if (frog.y - step >= 0) {
                    frog.y -= step;
                    score += 5; 
                    moved = true;
                }
                break;
            case 'ArrowDown':
            case 'KeyS':
                if (frog.y + step < height) { frog.y += step; moved = true; }
                break;
            case 'ArrowLeft':
            case 'KeyA':
                if (frog.x - step >= 0) { frog.x -= step; moved = true; }
                break;
            case 'ArrowRight':
            case 'KeyD':
                if (frog.x + step <= width - frog.size) { frog.x += step; moved = true; }
                break;
        }
        if (moved) playSound('jump');
    }
});

// 啟動遊戲
initLevel();
requestAnimationFrame(gameLoop);

</script>
</body>
</html>
